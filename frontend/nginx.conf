server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defense-in-depth for the dashboard SPA) ──────────────
    # CSP allows same-origin plus the WorkOS auth domains used by AuthKit. Tune the
    # connect-src if you point at a non-*.workos.com issuer.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.workos.com https://api.workos.com; frame-src https://*.workos.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Control-plane dashboard proxies directly to cloud services in this repo.
    # Authorization is forwarded so the backend can authenticate + resolve tenant.
    # No wildcard Access-Control-Allow-Origin: these are same-origin proxies, and
    # CORS (when needed) is owned by the backend allow-lists.
    location /api/services {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/gateway {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/portal {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/analysis {
        proxy_pass http://ai-analysis-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/rules {
        proxy_pass http://rule-engine:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # MendrScript conversation engine (Server-Sent Events). Buffering OFF and a long
    # read timeout are required so synth-loop progress streams to the chat in real time.
    location /api/chat/ {
        proxy_pass http://conversation-engine:8085/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
