[package]
name = "mendr-minimize"
version = "0.1.0"
edition = "2021"
description = "Deterministic MendrScript remediation minimization (ddmin + eqsat + bounded SyGuS)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egg = "0.9"
thiserror = "1"

[[bin]]
name = "mendr-minimize"
path = "src/main.rs"
