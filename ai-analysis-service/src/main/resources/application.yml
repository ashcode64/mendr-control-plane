server:
  port: 8082

spring:
  application:
    name: ai-analysis-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/selfhealing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-analysis-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.selfhealing.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.selfhealing.analysis.dto.ApiFailureEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mendr:
  tenancy:
    default-tenant-id: 00000000-0000-0000-0000-000000000001
    fallback-to-default: ${MENDR_TENANCY_FALLBACK_TO_DEFAULT:true}
  conversation:
    # When set, AiAnalysisService routes automated failures through conversation-engine
    # POST /diagnose (LangGraph verify/simulate). Empty = legacy in-process LLM path.
    diagnose-url: ${MENDR_CONVERSATION_DIAGNOSE_URL:}
  conformal:
    risk-budget: ${MENDR_CONFORMAL_RISK_BUDGET:0.01}
    auto-apply-enabled: ${MENDR_CONFORMAL_AUTO_APPLY:false}
    score-model: ${MENDR_CONFORMAL_SCORE_MODEL:logistic}
    allow-opaque-model: ${MENDR_CONFORMAL_ALLOW_OPAQUE:false}
    min-train-n: ${MENDR_CONFORMAL_MIN_TRAIN_N:500}
    cross-tenant-train: ${MENDR_CONFORMAL_CROSS_TENANT_TRAIN:false}
    retrain-ms: ${MENDR_CONFORMAL_RETRAIN_MS:3600000}
  metamorphic:
    fuzz-count: ${MENDR_METAMORPHIC_FUZZ_COUNT:256}
  ddmin:
    max-fields: ${MENDR_DDMIN_MAX_FIELDS:32}
    live-safe-methods: ${MENDR_DDMIN_LIVE_METHODS:GET,HEAD,OPTIONS}
    # Deprecated alias (same env); prefer live-safe-methods. PUT/DELETE hard-denied in code.
    live-idempotent-methods: ${MENDR_DDMIN_LIVE_METHODS:GET,HEAD,OPTIONS}
    abort-non-safe: ${MENDR_DDMIN_ABORT_NON_SAFE:true}
    live-max-probes-per-incident: ${MENDR_DDMIN_LIVE_MAX_PROBES:32}
    live-min-interval-ms: ${MENDR_DDMIN_LIVE_MIN_INTERVAL_MS:50}
    live-timeout-ms: ${MENDR_DDMIN_LIVE_TIMEOUT_MS:3000}
  bandit:
    enabled: ${MENDR_BANDIT_ENABLED:true}
    only-ambiguous: ${MENDR_BANDIT_ONLY_AMBIGUOUS:true}
    candidates: ${MENDR_BANDIT_CANDIDATES:3}
  quality:
    # Race guard only (not a quality gate). Wilson decides promote/demote.
    min-age-minutes: ${MENDR_QUALITY_MIN_AGE_MINUTES:1}
    wilson-min-n: ${MENDR_QUALITY_WILSON_MIN_N:3}
    wilson-z: ${MENDR_QUALITY_WILSON_Z:1.96}
    wilson-promote-threshold: ${MENDR_QUALITY_WILSON_PROMOTE:0.85}
    wilson-demote-threshold: ${MENDR_QUALITY_WILSON_DEMOTE:0.40}
  spec-trust:
    calibrate-cron: ${MENDR_SPEC_TRUST_CRON:0 15 */6 * * *}
    sample-limit: ${MENDR_SPEC_TRUST_SAMPLE_LIMIT:40}
  dspy:
    enabled: ${MENDR_DSPY_ENABLED:false}
    pii-scrub-approved: ${MENDR_DSPY_PII_SCRUB_APPROVED:false}
  ebpf:
    enabled: ${MENDR_EBPF_ENABLED:false}
  llm:
    runtime: ${MENDR_LLM_RUNTIME:anthropic}
  precedents:
    lag-window-minutes: ${MENDR_PRECEDENTS_LAG_WINDOW_MINUTES:15}
    # Deprecated unused — Wilson uses quality.min-age-minutes. Kept so old env vars do not break.
    quiet-window-minutes: ${MENDR_PRECEDENTS_QUIET_WINDOW_MINUTES:${MENDR_QUALITY_MIN_AGE_MINUTES:1}}
    vector-top-k: ${MENDR_PRECEDENTS_VECTOR_TOP_K:8}
    quality-sweep-ms: ${MENDR_PRECEDENTS_QUALITY_SWEEP_MS:300000}
    anonymize-ms: ${MENDR_PRECEDENTS_ANONYMIZE_MS:600000}
    cross-tenant-champions: ${MENDR_PRECEDENTS_CROSS_TENANT:false}
    # Optional conversation-engine embed endpoint (Gemini when key set; else CE hash).
    # Empty = local Java hash (matches rule-engine commits).
    embed-url: ${MENDR_CONVERSATION_EMBED_URL:}
  analysis:
    security:
      # When true, /mcp and /api/analysis require a valid credential (WorkOS JWT for the
      # dashboard, shared internal key for machines). When false, endpoints stay open but
      # the tenant is still bound from any credential present (safe incremental rollout).
      enforce: ${MENDR_AUTH_ENFORCE:false}
      internal-api-key: ${GATEWAY_INTERNAL_API_KEY:}
      cors-allowed-origins: ${MENDR_CORS_ALLOWED_ORIGINS:http://localhost:3000}
      workos:
        jwks-uri: ${MENDR_AUTH_WORKOS_JWKS_URI:}
        issuer: ${MENDR_AUTH_WORKOS_ISSUER:}
        audience: ${MENDR_AUTH_WORKOS_AUDIENCE:}
        org-claim: ${MENDR_AUTH_WORKOS_ORG_CLAIM:org_id}

# Shared internal key used by MendrScriptGatewayClient when calling the gateway verifier.
gateway:
  internal:
    api-key: ${GATEWAY_INTERNAL_API_KEY:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  api-url: https://api.anthropic.com/v1/messages
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
  max-tokens: 2000
  confidence-threshold: 0.75
  agent-loop:
    max-turns: 3   # Tier-3 bounded agent loop: max read-only context-tool turns before a forced propose_* tool

llm:
  provider: ${LLM_PROVIDER:anthropic}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  api-url: https://generativelanguage.googleapis.com/v1beta
  max-output-tokens: 2000
  agent-loop:
    max-turns: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.selfhealing: DEBUG
