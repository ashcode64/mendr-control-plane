server:
  port: 8082

spring:
  application:
    name: ai-analysis-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/selfhealing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-analysis-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.selfhealing.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.selfhealing.analysis.dto.ApiFailureEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  api-url: https://api.anthropic.com/v1/messages
  model: claude-haiku-4-5-20251001
  max-tokens: 2000
  confidence-threshold: 0.75
  agent-loop:
    max-turns: 3   # Tier-3 bounded agent loop: max read-only context-tool turns before a forced propose_* tool

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.selfhealing: DEBUG
