server:
  port: 8084

spring:
  application:
    name: rule-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/selfhealing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: 6379
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: rule-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "java.util.Map"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mendr:
  tenancy:
    default-tenant-id: 00000000-0000-0000-0000-000000000001
    fallback-to-default: ${MENDR_TENANCY_FALLBACK_TO_DEFAULT:true}
  auth:
    # When true, /api/rules requires a valid credential (WorkOS JWT for the dashboard,
    # shared internal key for machines). When false, endpoints stay open but the tenant is
    # still bound from any credential present (safe incremental rollout).
    enforce: ${MENDR_AUTH_ENFORCE:false}
    internal-api-key: ${GATEWAY_INTERNAL_API_KEY:}
    cors-allowed-origins: ${MENDR_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    workos:
      jwks-uri: ${MENDR_AUTH_WORKOS_JWKS_URI:}
      issuer: ${MENDR_AUTH_WORKOS_ISSUER:}
      audience: ${MENDR_AUTH_WORKOS_AUDIENCE:}
      org-claim: ${MENDR_AUTH_WORKOS_ORG_CLAIM:org_id}

rules:
  default-ttl-hours: 48
  route-changed-channel: route-changed

management:
  endpoints:
    web:
      exposure:
        include: health,info
