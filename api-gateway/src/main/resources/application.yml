server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/selfhealing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: 6379
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.selfhealing: DEBUG

mendr:
  tenancy:
    default-tenant-id: 00000000-0000-0000-0000-000000000001
    # Set false for strict isolation once every entry point sets a real tenant.
    fallback-to-default: ${MENDR_TENANCY_FALLBACK_TO_DEFAULT:true}
  metamorphic:
    fuzz-count: ${MENDR_METAMORPHIC_FUZZ_COUNT:256}
  minimize:
    enabled: ${MENDR_MINIMIZE_ENABLED:true}
    base-url: ${MENDR_MINIMIZE_BASE_URL:http://mendr-minimize:8099}
    spec-trust-gate: ${MENDR_MINIMIZE_SPEC_TRUST_GATE:0.85}
    prove-max-ops: ${MENDR_MINIMIZE_PROVE_MAX_OPS:8}
  auth:
    # When true every request must present a WorkOS JWT or per-tenant API key.
    enforce: ${MENDR_AUTH_ENFORCE:false}
    # WorkOS JWT validation is enabled only when a JWKS URI is provided via env
    # (left out of YAML so "unset" means truly absent, not empty):
    #   MENDR_AUTH_WORKOS_JWKS_URI, MENDR_AUTH_WORKOS_ISSUER,
    #   MENDR_AUTH_WORKOS_AUDIENCE, MENDR_AUTH_WORKOS_ORG_CLAIM (default org_id)

gateway:
  rules:
    cache-ttl-seconds: 60
    confidence-threshold: 0.75
  sync:
    outbox-enabled: true
    outbox-poll-interval-ms: 3000
    outbox-initial-delay-ms: 5000
    outbox-max-attempts: 10
    outbox-retry-backoff-seconds: 5
    reconciler-enabled: true
    reconciler-interval-ms: 60000
    reconciler-initial-delay-ms: 45000
  internal:
    api-key: ${GATEWAY_INTERNAL_API_KEY:}
    validate-dedup-ttl-seconds: 60
    failure-dedup-ttl-seconds: 60
    route-config-snapshot-ttl-seconds: 0
  openresty:
    docker-host-rewrite: ${MENDR_DOCKER_HOST_REWRITE:}
    # Re-enable Java proxy fallback locally: set MENDR_JAVA_FALLBACK=true on mendr-gateway
    baseline-routes:
      - source-service: order-service
        target-service: payment-service
        endpoint: /api/payments/process
      - source-service: order-service
        target-service: payment-service
        endpoint: /api/payments/process/response-error
  fastpath:
    l1-max-size: 10000
    l1-ttl-seconds: 3
    route-changed-channel: route-changed
    streaming-transforms-enabled: true
    http-pool:
      max-total: 200
      max-per-route: 50
      connect-timeout-ms: 5000
      response-timeout-ms: 10000
