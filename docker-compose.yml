services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: selfhealing
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-admin}
      # Superuser password. Override in every non-dev environment via .env / secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Runs after init.sql ("init_v2_*" sorts after "init.sql"): multi-tenancy + RLS + app_user
      - ./infra/init_v2_multitenancy.sql:/docker-entrypoint-initdb.d/init_v2_multitenancy.sql
      - ./infra/init_v3_analysis_conversations.sql:/docker-entrypoint-initdb.d/init_v3_analysis_conversations.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d selfhealing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,mntr,stat"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  api-gateway:
    build: ./api-gateway
    image: mendr/control-plane-api-gateway:latest
    ports:
      - "8095:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/selfhealing
      # Non-superuser role so Postgres RLS is actually enforced (superusers bypass it).
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_AI_ANALYSIS: http://ai-analysis-service:8082
      SERVICES_RULE_ENGINE: http://rule-engine:8084
      MENDR_DOCKER_HOST_REWRITE: host.docker.internal
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      # Auth (off by default for incremental rollout). Set JWKS URI to enable WorkOS JWT.
      MENDR_AUTH_ENFORCE: ${MENDR_AUTH_ENFORCE:-false}
      MENDR_AUTH_WORKOS_JWKS_URI: ${MENDR_AUTH_WORKOS_JWKS_URI:-}
      MENDR_AUTH_WORKOS_ISSUER: ${MENDR_AUTH_WORKOS_ISSUER:-}
      MENDR_AUTH_WORKOS_AUDIENCE: ${MENDR_AUTH_WORKOS_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-analysis-service:
    build: ./ai-analysis-service
    image: mendr/control-plane-ai-analysis:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/selfhealing
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      # Auth: WorkOS JWT for the dashboard (/api/analysis), shared internal key for /mcp.
      # enforce=false keeps endpoints open while still binding tenant context.
      MENDR_AUTH_ENFORCE: ${MENDR_AUTH_ENFORCE:-false}
      MENDR_AUTH_WORKOS_JWKS_URI: ${MENDR_AUTH_WORKOS_JWKS_URI:-}
      MENDR_AUTH_WORKOS_ISSUER: ${MENDR_AUTH_WORKOS_ISSUER:-}
      MENDR_AUTH_WORKOS_AUDIENCE: ${MENDR_AUTH_WORKOS_AUDIENCE:-}
      MENDR_CORS_ALLOWED_ORIGINS: ${MENDR_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  conversation-engine:
    build: ./conversation-engine
    image: mendr/control-plane-conversation-engine:latest
    ports:
      - "8085:8085"
    environment:
      MCP_BASE_URL: http://ai-analysis-service:8082
      ANALYSIS_BASE_URL: http://ai-analysis-service:8082
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      MAX_REFINE_ITERATIONS: "3"
      # Auth + tenant propagation to the MCP surface, CORS lockdown, abuse controls.
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      MENDR_AUTH_ENFORCE: ${MENDR_AUTH_ENFORCE:-false}
      MENDR_AUTH_WORKOS_JWKS_URI: ${MENDR_AUTH_WORKOS_JWKS_URI:-}
      MENDR_AUTH_WORKOS_ISSUER: ${MENDR_AUTH_WORKOS_ISSUER:-}
      MENDR_AUTH_WORKOS_AUDIENCE: ${MENDR_AUTH_WORKOS_AUDIENCE:-}
      MENDR_CORS_ALLOWED_ORIGINS: ${MENDR_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MENDR_CHAT_RATE_LIMIT_PER_MIN: ${MENDR_CHAT_RATE_LIMIT_PER_MIN:-20}
    depends_on:
      ai-analysis-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    image: mendr/control-plane-notification:latest
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/selfhealing
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  rule-engine:
    build: ./rule-engine
    image: mendr/control-plane-rule-engine:latest
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/selfhealing
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}
      # Auth: WorkOS JWT for the dashboard (/api/rules), shared internal key for machines.
      MENDR_AUTH_ENFORCE: ${MENDR_AUTH_ENFORCE:-false}
      MENDR_AUTH_WORKOS_JWKS_URI: ${MENDR_AUTH_WORKOS_JWKS_URI:-}
      MENDR_AUTH_WORKOS_ISSUER: ${MENDR_AUTH_WORKOS_ISSUER:-}
      MENDR_AUTH_WORKOS_AUDIENCE: ${MENDR_AUTH_WORKOS_AUDIENCE:-}
      MENDR_CORS_ALLOWED_ORIGINS: ${MENDR_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: mendr/control-plane-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started
      ai-analysis-service:
        condition: service_started
      rule-engine:
        condition: service_started
      conversation-engine:
        condition: service_started

volumes:
  postgres_data:
